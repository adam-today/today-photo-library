    // ============================================================
    // UTILITIES
    // ============================================================
    // ---- Thumbnail URL helpers ----
    // Primary approach: use thumbnailLink from Drive API in a plain <img> tag
    // (img tags bypass CORS, so lh3.googleusercontent.com works).
    // Fallback for failures: authenticated Drive API download → blob URL.
    function getThumbnailUrl(photo, width = 400) {
      if (photo.thumbnailLink) {
        let url = photo.thumbnailLink;
        // Replace size param anywhere in URL (not anchored to end — URLs may have trailing params)
        if (/=s\d+/.test(url)) url = url.replace(/=s\d+/, `=w${width}`);
        else if (/=w\d+/.test(url)) url = url.replace(/=w\d+/, `=w${width}`);
        return url;
      }
      return null; // no thumbnail available via URL
    }

    // Concurrency-limited fallback loader via authenticated Drive API
    const thumbBlobCache = new Map();
    const thumbQueue = [];
    let thumbActive = 0;
    const THUMB_CONCURRENCY = 4;

    function processThumbQueue() {
      while (thumbActive < THUMB_CONCURRENCY && thumbQueue.length > 0) {
        const job = thumbQueue.shift();
        thumbActive++;
        job().finally(() => { thumbActive--; processThumbQueue(); });
      }
    }

    function loadThumbBlob(fileId, token) {
      if (thumbBlobCache.has(fileId)) return Promise.resolve(thumbBlobCache.get(fileId));
      return new Promise((resolve) => {
        thumbQueue.push(async () => {
          try {
            const resp = await fetch(
              `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
              { headers: { Authorization: `Bearer ${token}` } }
            );
            if (!resp.ok) { resolve(null); return; }
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            thumbBlobCache.set(fileId, url);
            resolve(url);
          } catch { resolve(null); }
        });
        processThumbQueue();
      });
    }
    function getDriveUrl(fileId) {
      return `https://drive.google.com/file/d/${fileId}/view`;
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function formatFileSize(bytes) {
      if (!bytes) return '';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }
    function debounce(fn, ms) {
      let timer;
      return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };

    // ============================================================
    // GOOGLE DRIVE API
    // ============================================================
    // Global ref so driveApiFetch can clear an expired token
    let _clearExpiredToken = null;

    async function driveApiFetch(path, token, options = {}) {
      const base = 'https://www.googleapis.com/drive/v3';
      const url = path.startsWith('http') ? path : `${base}${path}`;
      const res = await fetch(url, {
        ...options,
        headers: { Authorization: `Bearer ${token}`, ...options.headers }
      });
      if (res.status === 401) {
        // Token expired — clear it so the app shows the sign-in screen
        sessionStorage.removeItem('today_photos_token');
        if (_clearExpiredToken) _clearExpiredToken();
        throw new Error('Session expired — please sign in again');
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `Drive API error ${res.status}`);
      }
      return options.raw ? res : res.json();
    }

    async function listFolderChildren(folderId, token, mimeFilter = null) {
      let allFiles = [];
      let pageToken = null;
      do {
        let q = `'${folderId}' in parents and trashed = false`;
        if (mimeFilter) q += ` and mimeType = '${mimeFilter}'`;
        const fields = 'nextPageToken,files(id,name,mimeType,thumbnailLink,webViewLink,webContentLink,createdTime,modifiedTime,imageMediaMetadata,size,parents)';
        let url = `/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(fields)}&pageSize=${CONFIG.PAGE_SIZE}&orderBy=name`;
        if (pageToken) url += `&pageToken=${pageToken}`;
        const data = await driveApiFetch(url, token);
        allFiles = allFiles.concat(data.files || []);
        pageToken = data.nextPageToken;
      } while (pageToken);
      return allFiles;
    }

    async function loadSubfolders(folderId, token) {
      return listFolderChildren(folderId, token, 'application/vnd.google-apps.folder');
    }

    async function loadImages(folderId, token) {
      const all = await listFolderChildren(folderId, token);
      return all.filter(f => CONFIG.IMAGE_MIMES.has(f.mimeType));
    }

    async function loadImagesRecursive(folderId, token, onProgress) {
      // Load images from this folder
      const all = await listFolderChildren(folderId, token);
      const images = all.filter(f => CONFIG.IMAGE_MIMES.has(f.mimeType));
      const subfolders = all.filter(f => f.mimeType === 'application/vnd.google-apps.folder');

      if (onProgress) onProgress(images.length, subfolders.length);

      // Recursively load from subfolders (in parallel, batched to avoid rate limits)
      const batchSize = 5;
      let allImages = [...images];
      for (let i = 0; i < subfolders.length; i += batchSize) {
        const batch = subfolders.slice(i, i + batchSize);
        const results = await Promise.all(
          batch.map(f => loadImagesRecursive(f.id, token, onProgress))
        );
        for (const r of results) allImages = allImages.concat(r);
      }
      return allImages;
    }

    // Fetch specific files by their IDs (for quick filter preloading)
    async function fetchFilesByIds(ids, token) {
      if (!ids || ids.length === 0) return [];
      const fields = 'id,name,mimeType,thumbnailLink,webViewLink,webContentLink,createdTime,modifiedTime,imageMediaMetadata,size,parents';
      const batchSize = 50; // avoid overly long queries
      let allFiles = [];
      for (let i = 0; i < ids.length; i += batchSize) {
        const batch = ids.slice(i, i + batchSize);
        const results = await Promise.all(
          batch.map(id =>
            driveApiFetch(`/files/${id}?fields=${encodeURIComponent(fields)}`, token)
              .catch(() => null)
          )
        );
        allFiles = allFiles.concat(results.filter(f => f && f.id));
      }
      return allFiles;
    }

    // Metadata file (shared tags, Official selects)
    async function findMetadataFile(token) {
      const q = `name = '${CONFIG.METADATA_FILENAME}' and '${CONFIG.ROOT_FOLDER_ID}' in parents and trashed = false`;
      const data = await driveApiFetch(`/files?q=${encodeURIComponent(q)}&fields=files(id)`, token);
      return data.files?.[0]?.id || null;
    }

    async function loadMetadata(token) {
      const fileId = await findMetadataFile(token);
      if (!fileId) return { adamSelects: [], favourites: [], tags: {}, version: 1 };
      const data = await driveApiFetch(`/files/${fileId}?alt=media`, token);
      return data;
    }

    async function saveMetadata(metadata, token) {
      const existing = await findMetadataFile(token);
      const body = JSON.stringify({ ...metadata, lastUpdated: new Date().toISOString() });
      if (existing) {
        await driveApiFetch(
          `https://www.googleapis.com/upload/drive/v3/files/${existing}?uploadType=media`,
          token,
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }
        );
      } else {
        // Create new file
        const metaRes = await driveApiFetch('/files', token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: CONFIG.METADATA_FILENAME, parents: [CONFIG.ROOT_FOLDER_ID], mimeType: 'application/json' })
        });
        await driveApiFetch(
          `https://www.googleapis.com/upload/drive/v3/files/${metaRes.id}?uploadType=media`,
          token,
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body }
        );
      }
    }

    // Thumbnail map (originalFileId -> thumbnailFileId, generated by Cloud Function)
    async function loadThumbMap(token) {
      try {
        const q = `name = '${CONFIG.THUMB_MAP_FILENAME}' and '${CONFIG.ROOT_FOLDER_ID}' in parents and trashed = false`;
        const data = await driveApiFetch(`/files?q=${encodeURIComponent(q)}&fields=files(id)`, token);
        const fileId = data.files?.[0]?.id;
        if (!fileId) return {};
        const mapData = await driveApiFetch(`/files/${fileId}?alt=media`, token);
        console.log(`Loaded thumbnail map: ${Object.keys(mapData).length} entries`);
        return mapData;
      } catch (err) {
        console.warn('Could not load thumbnail map:', err);
        return {};
      }
    }

    async function downloadFileBlob(fileId, token) {
      const res = await driveApiFetch(`/files/${fileId}?alt=media`, token, { raw: true });
      return res.blob();
    }

    // ---- In-app thumbnail generator ----
    // Uses Canvas API to resize images client-side and uploads small JPEGs to Drive.
    const THUMB_FOLDER_NAME = '_today_thumbnails';
    const THUMB_WIDTH = 600;
    const THUMB_QUALITY = 0.75;

    async function getOrCreateThumbFolder(token) {
      const q = `name = '${THUMB_FOLDER_NAME}' and '${CONFIG.ROOT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
      const data = await driveApiFetch(`/files?q=${encodeURIComponent(q)}&fields=files(id)`, token);
      if (data.files?.length > 0) return data.files[0].id;
      // Create folder
      const folder = await driveApiFetch('/files', token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: THUMB_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder', parents: [CONFIG.ROOT_FOLDER_ID] }),
      });
      return folder.id;
    }

    function resizeImageToBlob(imgBlob, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(
            (blob) => { if (blob) resolve(blob); else reject(new Error('Canvas toBlob failed')); },
            'image/jpeg',
            quality
          );
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('Image load failed')); };
        img.src = URL.createObjectURL(imgBlob);
      });
    }

    async function uploadThumbToFolder(thumbBlob, originalId, folderId, token) {
      const metadata = { name: `${originalId}.jpg`, mimeType: 'image/jpeg', parents: [folderId] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', thumbBlob, `${originalId}.jpg`);
      const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form,
      });
      if (!resp.ok) throw new Error(`Upload failed: ${resp.status}`);
      const data = await resp.json();
      return data.id;
    }

    async function findThumbMapFileId(token) {
      const q = `name = '${CONFIG.THUMB_MAP_FILENAME}' and '${CONFIG.ROOT_FOLDER_ID}' in parents and trashed = false`;
      const data = await driveApiFetch(`/files?q=${encodeURIComponent(q)}&fields=files(id)`, token);
      return data.files?.[0]?.id || null;
    }

    async function saveThumbMapToDrive(thumbMap, token) {
      const body = JSON.stringify(thumbMap);
      const existingId = await findThumbMapFileId(token);
      if (existingId) {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body,
        });
      } else {
        const metadata = { name: CONFIG.THUMB_MAP_FILENAME, mimeType: 'application/json', parents: [CONFIG.ROOT_FOLDER_ID] };
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', new Blob([body], { type: 'application/json' }), CONFIG.THUMB_MAP_FILENAME);
        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: form,
        });
      }
    }

    async function generateThumbnails(allPhotos, existingThumbMap, token, onProgress) {
      const needsThumb = allPhotos.filter(p => !existingThumbMap[p.id]);
      if (needsThumb.length === 0) return { map: existingThumbMap, created: 0 };

      const thumbFolderId = await getOrCreateThumbFolder(token);
      const updatedMap = { ...existingThumbMap };
      let created = 0;
      let failed = 0;

      for (let i = 0; i < needsThumb.length; i++) {
        const photo = needsThumb[i];
        if (onProgress) onProgress({ current: i + 1, total: needsThumb.length, name: photo.name, created, failed });
        try {
          // Download original
          const origBlob = await downloadFileBlob(photo.id, token);
          // Resize with Canvas
          const thumbBlob = await resizeImageToBlob(origBlob, THUMB_WIDTH, THUMB_QUALITY);
          // Upload
          const thumbId = await uploadThumbToFolder(thumbBlob, photo.id, thumbFolderId, token);
          updatedMap[photo.id] = thumbId;
          created++;
        } catch (err) {
          console.warn(`Thumb failed for ${photo.name}:`, err);
          failed++;
        }

        // Save map every 20 images (in case browser closes)
        if (created > 0 && created % 20 === 0) {
          await saveThumbMapToDrive(updatedMap, token);
        }
      }

      // Final save
      await saveThumbMapToDrive(updatedMap, token);
      if (onProgress) onProgress({ current: needsThumb.length, total: needsThumb.length, created, failed, done: true });
      return { map: updatedMap, created };
    }

      const folderNameMap = useRef(new Map());

      const getFolderPath = useCallback((folderId) => {
        // Walk up from folderNameMap
        const path = [];
        let id = folderId;
        while (id && id !== CONFIG.ROOT_FOLDER_ID) {
          const name = folderNameMap.current.get(id);
          if (name) path.unshift({ id, name });
          // Find parent
          const findParent = (node, targetId) => {
            if (!node?.children) return null;
            for (const child of node.children) {
              if (child.id === targetId) return node.id;
              const found = findParent(child, targetId);
              if (found) return found;
            }
            return null;
          };
          id = findParent(folderTree, id);
        }
        return path;
      }, [folderTree]);

      const isAdam = user?.email?.toLowerCase().trim() === 'adam@today.design';

      const value = {
        token, setToken, user, setUser, isAdam,
        folderTree, setFolderTree, expandedFolders, setExpandedFolders,
        currentFolderId, setCurrentFolderId, currentFolderName, setCurrentFolderName,
        photos, setPhotos, allPhotosFlat, setAllPhotosFlat,

        error, setError,
        folderNameMap, getFolderPath,
        thumbMap, setThumbMap,
      };

      return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    }

              client_id: CONFIG.GOOGLE_CLIENT_ID,
              scope: CONFIG.SCOPES,
              callback: async (response) => {
                if (response.access_token) {
                  setToken(response.access_token);
                  // Fetch user info via Drive about endpoint (works with drive scope)
                  try {
                    const [userRes, driveRes] = await Promise.all([
                      fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                        headers: { Authorization: `Bearer ${response.access_token}` }
                      }).catch(() => null),
                      fetch('https://www.googleapis.com/drive/v3/about?fields=user', {
                        headers: { Authorization: `Bearer ${response.access_token}` }
                      }).catch(() => null),
                    ]);
                    let data = {};
                    if (userRes?.ok) data = await userRes.json();
                    if (driveRes?.ok) {
                      const driveData = await driveRes.json();
                      if (driveData.user) {
                        data.email = data.email || driveData.user.emailAddress;
                        data.name = data.name || driveData.user.displayName;
                        data.picture = data.picture || driveData.user.photoLink;

                    setUser(data);

                  } catch {}
                }
                setLoading(false);
              },

        return () => clearInterval(check);

    const PhotoCard = memo(({ photo, index, size }) => {
      const { favourites, toggleFavourite, myPicks, toggleMyPick, metadata, toggleAdamSelect, selectMode,
        selectedPhotos, toggleSelect, setLightboxIdx, setTagDialogPhoto, token, thumbMap, isAdam } = useApp();
      const isFav = favourites.has(photo.id);
      const isPick = myPicks.has(photo.id);
      const isSelect = (metadata.adamSelects || []).includes(photo.id);
      const isSelected = selectedPhotos.has(photo.id);
      const tags = metadata.tags?.[photo.id] || [];
      const serviceAreaTags = metadata.serviceAreas?.[photo.id] || [];
      const [loaded, setLoaded] = useState(false);
      const [urlFailed, setUrlFailed] = useState(false);
      const [blobSrc, setBlobSrc] = useState(() => thumbBlobCache.get(photo.id) || null);
      const [totalFailed, setTotalFailed] = useState(false);

      const thumbWidth = Math.min(size * 2, 800);
      const thumbFileId = thumbMap[photo.id]; // pre-generated thumbnail ID (if exists)
      const directUrl = getThumbnailUrl(photo, thumbWidth);

      // Strategy:
      // 1. If pre-generated thumbnail exists → fetch that small file via Drive API (fast, ~30-50KB)
      // 2. Else try thumbnailLink in <img> tag (no CORS issue for img tags)
      // 3. If that fails → fallback to full image via Drive API
      useEffect(() => {
        // Only use blob fetch if we have a pre-gen thumb, or if the direct URL failed, or if there's no URL
        const needsBlob = thumbFileId || urlFailed || !directUrl;
        if (!needsBlob || blobSrc || totalFailed || !token) return;
        let cancelled = false;
        const fileToFetch = thumbFileId || photo.id;
        loadThumbBlob(fileToFetch, token).then(url => {
          if (cancelled) return;
          if (url) setBlobSrc(url);
          else setTotalFailed(true);
        });
        return () => { cancelled = true; };
      }, [thumbFileId, urlFailed, directUrl, blobSrc, totalFailed, token, photo.id]);

    // ============================================================
    // PHOTO GRID
    // ============================================================
    function PhotoGrid() {
      const { photos, thumbSize, isLoadingPhotos, loadingStatus, searchQuery, filterPeople,
        filterServiceAreas, sortBy, sortOrder, quickFilter, favourites, myPicks, metadata, currentFolderName } = useApp();

      const filteredPhotos = useMemo(() => {
        let result = [...photos];

        // Quick filters
        if (quickFilter === 'favourites') {
          result = result.filter(p => favourites.has(p.id));
        } else if (quickFilter === 'adamSelects') {
          result = result.filter(p => (metadata.adamSelects || []).includes(p.id));
        } else if (quickFilter === 'myPicks') {
          result = result.filter(p => myPicks.has(p.id));
        }

        // Search
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          result = result.filter(p => {
            const tags = (metadata.tags?.[p.id] || []).join(' ').toLowerCase();
            return p.name.toLowerCase().includes(q) || tags.includes(q);
          });
        }

        // People filter
        if (filterPeople.length > 0) {
          result = result.filter(p => {
            const tags = metadata.tags?.[p.id] || [];
            return filterPeople.some(person => tags.includes(person));
          });
        }

        // Service area filter
        if (filterServiceAreas.length > 0) {
          result = result.filter(p => {
            const areas = metadata.serviceAreas?.[p.id] || [];
            return filterServiceAreas.some(area => areas.includes(area));
          });
        }

        // Sort
        result.sort((a, b) => {
          let cmp = 0;
          if (sortBy === 'name') cmp = a.name.localeCompare(b.name);
          else if (sortBy === 'date') cmp = new Date(a.createdTime || 0) - new Date(b.createdTime || 0);
          else if (sortBy === 'size') cmp = (a.size || 0) - (b.size || 0);
          return sortOrder === 'desc' ? -cmp : cmp;
        });

        return result;
      }, [photos, searchQuery, filterPeople, filterServiceAreas, sortBy, sortOrder, quickFilter, favourites, myPicks, metadata]);

      if (isLoadingPhotos) {
        return (
          <div className="flex-1 flex items-center justify-center">
            <div className="text-center text-zinc-400">
              <Icon name="loader" size={24} className="mx-auto mb-2" />
              <div className="text-sm">{loadingStatus || 'Loading photos...'}</div>
            </div>
          </div>
        );
      }

      if (photos.length === 0) {
        return (
          <div className="flex-1 flex items-center justify-center">
            <div className="text-center text-zinc-400">
              <Icon name="image" size={32} className="mx-auto mb-3 text-zinc-300" />
              <div className="text-sm font-medium text-zinc-500">No images in this folder</div>
              <div className="text-xs mt-1">Select a folder from the sidebar</div>
            </div>
          </div>
        );
      }

      if (filteredPhotos.length === 0) {
        return (
          <div className="flex-1 flex items-center justify-center">
            <div className="text-center text-zinc-400">
              <Icon name="search" size={32} className="mx-auto mb-3 text-zinc-300" />
              <div className="text-sm font-medium text-zinc-500">No matching photos</div>
              <div className="text-xs mt-1">Try adjusting your search or filters</div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 overflow-y-auto p-4">
          <div className="text-xs text-zinc-400 mb-3">
            {filteredPhotos.length} {filteredPhotos.length === 1 ? 'photo' : 'photos'}
            {quickFilter === 'favourites' && ' in studio faves'}
            {quickFilter === 'adamSelects' && " in Official selects"}
            {quickFilter === 'myPicks' && ' in my picks'}
            {searchQuery && ` matching "${searchQuery}"`}
          </div>
          <div
            className="grid gap-2"
            style={{ gridTemplateColumns: `repeat(auto-fill, minmax(${thumbSize}px, 1fr))` }}
          >
            {filteredPhotos.map((photo, i) => (
              <PhotoCard key={photo.id} photo={photo} index={i} size={thumbSize} />
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // LIGHTBOX
    // ============================================================
    function Lightbox() {
      const { lightboxIdx, setLightboxIdx, photos, favourites, toggleFavourite,
        myPicks, toggleMyPick, metadata, toggleAdamSelect, setTagDialogPhoto, searchQuery, filterPeople,
        filterServiceAreas, sortBy, sortOrder, quickFilter, token, isAdam } = useApp();

      const [imgLoaded, setImgLoaded] = useState(false);
      const [imgError, setImgError] = useState(false);
      const [blobUrl, setBlobUrl] = useState(null);

      // Use the same filtered list as the grid
      const filteredPhotos = useMemo(() => {
        let result = [...photos];
        if (quickFilter === 'favourites') result = result.filter(p => favourites.has(p.id));
        else if (quickFilter === 'adamSelects') result = result.filter(p => (metadata.adamSelects || []).includes(p.id));
        else if (quickFilter === 'myPicks') result = result.filter(p => myPicks.has(p.id));
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          result = result.filter(p => {
            const tags = (metadata.tags?.[p.id] || []).join(' ').toLowerCase();
            return p.name.toLowerCase().includes(q) || tags.includes(q);
          });
        }
        if (filterPeople.length > 0) {
          result = result.filter(p => {
            const tags = metadata.tags?.[p.id] || [];
            return filterPeople.some(person => tags.includes(person));
          });
        }
        if (filterServiceAreas.length > 0) {
          result = result.filter(p => {
            const areas = metadata.serviceAreas?.[p.id] || [];
            return filterServiceAreas.some(area => areas.includes(area));
          });
        }
        result.sort((a, b) => {
          let cmp = 0;
          if (sortBy === 'name') cmp = a.name.localeCompare(b.name);
          else if (sortBy === 'date') cmp = new Date(a.createdTime || 0) - new Date(b.createdTime || 0);
          return sortOrder === 'desc' ? -cmp : cmp;
        });
        return result;
      }, [photos, searchQuery, filterPeople, filterServiceAreas, sortBy, sortOrder, quickFilter, favourites, myPicks, metadata]);

      const isOpen = lightboxIdx >= 0 && lightboxIdx < filteredPhotos.length;
      const photo = isOpen ? filteredPhotos[lightboxIdx] : null;
      const isFav = photo ? favourites.has(photo.id) : false;
      const isPick = photo ? myPicks.has(photo.id) : false;
      const isSelect = photo ? (metadata.adamSelects || []).includes(photo.id) : false;
      const tags = photo ? (metadata.tags?.[photo.id] || []) : [];
      const serviceAreas = photo ? (metadata.serviceAreas?.[photo.id] || []) : [];
      const hasPrev = lightboxIdx > 0;
      const hasNext = lightboxIdx < filteredPhotos.length - 1;

      // Fetch full image via Drive API when photo changes
      useEffect(() => {
        setImgLoaded(false);
        setImgError(false);
        if (blobUrl) { URL.revokeObjectURL(blobUrl); setBlobUrl(null); }

        if (!photo || !token) return;
        let cancelled = false;

        fetch(`https://www.googleapis.com/drive/v3/files/${photo.id}?alt=media`, {
          headers: { Authorization: `Bearer ${token}` }
        })
        .then(res => {
          if (!res.ok) throw new Error('Failed to load');
          return res.blob();
        })
        .then(blob => {
          if (!cancelled) {
            const url = URL.createObjectURL(blob);
            setBlobUrl(url);
          }
        })
        .catch(() => {
          if (!cancelled) setImgError(true);
        });

        return () => { cancelled = true; };
      }, [lightboxIdx, token]);

      // Browser back button support
      useEffect(() => {
        if (isOpen) {
          window.history.pushState({ lightbox: true }, '');
          const onPop = () => setLightboxIdx(-1);
          window.addEventListener('popstate', onPop);
          return () => window.removeEventListener('popstate', onPop);
        }
      }, [isOpen]);

      const closeLightbox = useCallback(() => {
        if (window.history.state?.lightbox) window.history.back();
        else setLightboxIdx(-1);
      }, []);

      // Keyboard navigation — ALL hooks must be above the early return
      const handleKeyDown = useCallback((e) => {
        if (!isOpen) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft' && hasPrev) setLightboxIdx(lightboxIdx - 1);
        if (e.key === 'ArrowRight' && hasNext) setLightboxIdx(lightboxIdx + 1);
      }, [isOpen, lightboxIdx, hasPrev, hasNext, closeLightbox]);

      useEffect(() => {
        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [handleKeyDown]);

      // Early return AFTER all hooks
      if (!isOpen || !photo) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/95 flex flex-col" onClick={closeLightbox}>
          {/* Top bar */}
          <div className="flex items-center justify-between p-4 text-white" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 min-w-0">
              <button onClick={closeLightbox} className="hover:bg-white/10 p-2 rounded-lg transition-colors">
                <Icon name="x" size={20} />
              </button>
              <div className="min-w-0">
                <div className="text-sm font-medium truncate">{photo.name}</div>
                <div className="text-xs text-zinc-400 flex items-center gap-3">
                  {formatDate(photo.createdTime)}
                  {photo.size && <span>{formatFileSize(photo.size)}</span>}
                  {photo.imageMediaMetadata && (
                    <span>{photo.imageMediaMetadata.width} × {photo.imageMediaMetadata.height}</span>
                  )}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-1">
              {(tags.length > 0 || serviceAreas.length > 0) && (
                <div className="flex gap-1 mr-3 flex-wrap">
                  {tags.map(t => (
                    <span key={t} className="text-xs bg-white/10 text-zinc-300 px-2 py-1 rounded-full">{t}</span>
                  ))}
                  {serviceAreas.map(a => (
                    <span key={a} className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full">{a}</span>
                  ))}
                </div>
              )}
              <button onClick={() => setTagDialogPhoto(photo)} className="hover:bg-white/10 p-2 rounded-lg transition-colors text-zinc-300 hover:text-white" title="Tag photo">
                <Icon name="tag" size={18} />
              </button>
              {isAdam && (
                <button onClick={() => toggleAdamSelect(photo.id)}
                  className={`p-2 rounded-lg transition-colors ${isSelect ? 'text-amber-400 bg-amber-400/10' : 'text-zinc-300 hover:text-white hover:bg-white/10'}`}
                  title="Official select">
                  <Icon name={isSelect ? 'starFill' : 'star'} size={18} />
                </button>
              )}
              <button onClick={() => toggleFavourite(photo.id)}
                className={`p-2 rounded-lg transition-colors ${isFav ? 'text-rose-400 bg-rose-400/10' : 'text-zinc-300 hover:text-white hover:bg-white/10'}`}
                title="Studio fave">
                <Icon name={isFav ? 'heartFill' : 'heart'} size={18} />
              </button>
              <button onClick={() => toggleMyPick(photo.id)}
                className={`p-2 rounded-lg transition-colors ${isPick ? 'text-blue-400 bg-blue-400/10' : 'text-zinc-300 hover:text-white hover:bg-white/10'}`}
                title="My pick">
                <Icon name={isPick ? 'bookmarkFill' : 'bookmark'} size={18} />
              </button>
              <a href={getDriveUrl(photo.id)} target="_blank" rel="noopener"
                className="hover:bg-white/10 p-2 rounded-lg transition-colors text-zinc-300 hover:text-white" title="Open in Google Drive">
                <Icon name="externalLink" size={18} />
              </a>
              <a href={`https://drive.google.com/uc?export=download&id=${photo.id}`} target="_blank" rel="noopener"
                className="hover:bg-white/10 p-2 rounded-lg transition-colors text-zinc-300 hover:text-white" title="Download original">
                <Icon name="download" size={18} />
              </a>
            </div>
          </div>

          {/* Image area */}
          <div className="flex-1 flex items-center justify-center relative min-h-0 px-16">
            {/* Loading spinner */}
            {!imgLoaded && !imgError && (
              <div className="absolute inset-0 flex items-center justify-center text-zinc-500">
                <Icon name="loader" size={28} />
              </div>
            )}
            {/* Error state */}
            {imgError && (
              <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 gap-3">
                <Icon name="image" size={40} />
                <div className="text-sm">Image couldn't be loaded</div>
                <a href={getDriveUrl(photo.id)} target="_blank" rel="noopener"
                  className="text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1">
                  Open in Google Drive <Icon name="externalLink" size={14} />
                </a>
              </div>
            )}
            {blobUrl && (
              <img
                src={blobUrl}
                alt={photo.name}
                onLoad={() => setImgLoaded(true)}
                onError={() => setImgError(true)}
                className={`max-w-full max-h-full object-contain rounded-lg shadow-2xl transition-opacity duration-300
                  ${imgLoaded ? 'opacity-100' : 'opacity-0'}`}
                onClick={e => e.stopPropagation()}
              />
            )}
            {/* Nav arrows */}
            {hasPrev && (
              <button
                onClick={(e) => { e.stopPropagation(); setLightboxIdx(lightboxIdx - 1); }}
                className="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center transition-colors backdrop-blur-sm"
              >
                <Icon name="arrowLeft" size={20} />
              </button>
            )}
            {hasNext && (
              <button
                onClick={(e) => { e.stopPropagation(); setLightboxIdx(lightboxIdx + 1); }}
                className="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/60 text-white flex items-center justify-center transition-colors backdrop-blur-sm"
              >
                <Icon name="arrowRight" size={20} />
              </button>
            )}
          </div>

          {/* Bottom counter */}
          <div className="text-center py-3 text-xs text-zinc-500">
            {lightboxIdx + 1} of {filteredPhotos.length}
          </div>
        </div>
      );
    }

                    >
                      <div className={`w-4 h-4 rounded border flex items-center justify-center
                        ${active ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-zinc-300'}`}>
                        {active && <Icon name="check" size={10} strokeWidth={3} />}
                      </div>
                      {area}
                    </button>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // TOOLBAR
    // ============================================================
    function Toolbar() {
      const { searchQuery, setSearchQuery, thumbSize, setThumbSize, selectMode, setSelectMode,
        selectedPhotos, setSelectedPhotos, photos, filterPeople, setFilterPeople,
        filterServiceAreas, setFilterServiceAreas,
        sortBy, setSortBy, sortOrder, setSortOrder, token, setZipProgress, zipProgress,
        currentFolderName, sidebarOpen, setSidebarOpen, quickFilter } = useApp();

      const [showFilterMenu, setShowFilterMenu] = useState(false);
      const [showServiceFilterMenu, setShowServiceFilterMenu] = useState(false);
      const [showSortMenu, setShowSortMenu] = useState(false);
      const [peopleSearch, setPeopleSearch] = useState('');
      const filterRef = useRef(null);
      const serviceFilterRef = useRef(null);
      const sortRef = useRef(null);

      // Close dropdowns on outside click
      useEffect(() => {
        const handler = (e) => {
          if (filterRef.current && !filterRef.current.contains(e.target)) setShowFilterMenu(false);
          if (serviceFilterRef.current && !serviceFilterRef.current.contains(e.target)) setShowServiceFilterMenu(false);
          if (sortRef.current && !sortRef.current.contains(e.target)) setShowSortMenu(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const handleDownloadZip = async () => {
        if (selectedPhotos.size === 0 || !token) return;
        setZipProgress({ current: 0, total: selectedPhotos.size });
        try {
          const zip = new JSZip();
          let i = 0;
          for (const id of selectedPhotos) {
            const photo = photos.find(p => p.id === id);
            if (!photo) continue;
            const blob = await downloadFileBlob(id, token);
            zip.file(photo.name, blob);
            i++;
            setZipProgress({ current: i, total: selectedPhotos.size });
          }
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `today-photos-${new Date().toISOString().slice(0,10)}.zip`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (e) {
          console.error('Zip download failed:', e);
        }
        setZipProgress(null);
      };

      const selectAll = () => {
        setSelectedPhotos(new Set(photos.map(p => p.id)));
      };

      const title = quickFilter === 'favourites' ? 'Studio faves' :
        quickFilter === 'adamSelects' ? "Official selects" :
        quickFilter === 'myPicks' ? 'My picks' : currentFolderName;

      return (
        <div className="border-b border-zinc-200 bg-white">
          {/* Title bar */}
          <div className="flex items-center gap-3 px-4 py-3">
            {!sidebarOpen && (
              <button onClick={() => setSidebarOpen(true)}
                className="text-zinc-400 hover:text-zinc-600 p-1 rounded-lg hover:bg-zinc-100">
                <Icon name="sidebar" size={18} />
              </button>
            )}
            <h1 className="text-lg font-semibold truncate">{title}</h1>
          </div>

          {/* Controls */}
          <div className="flex items-center gap-2 px-4 pb-3 flex-wrap">
            {/* Search */}
            <div className="relative flex-1 min-w-[200px] max-w-md">
              <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" />
              <input
                type="text"
                placeholder="Search photos..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-3 py-1.5 text-sm bg-zinc-50 border border-zinc-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-300 focus:bg-white"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')}
                  className="absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600">
                  <Icon name="x" size={14} />
                </button>
              )}
            </div>

            {/* People filter */}
            <div className="relative" ref={filterRef}>
              <button
                onClick={() => setShowFilterMenu(!showFilterMenu)}
                className={`flex items-center gap-1.5 px-3 py-1.5 text-sm border rounded-lg transition-colors
                  ${filterPeople.length > 0 ? 'bg-zinc-900 text-white border-zinc-900' : 'border-zinc-200 text-zinc-600 hover:bg-zinc-50'}`}
              >
                <Icon name="users" size={14} />
                <span>People{filterPeople.length > 0 ? ` (${filterPeople.length})` : ''}</span>
              </button>
              {showFilterMenu && (
                <div className="absolute top-full left-0 mt-1 w-64 bg-white border border-zinc-200 rounded-xl shadow-lg z-20 overflow-hidden">
                  <div className="p-2">
                    <input
                      type="text"
                      placeholder="Search..."
                      value={peopleSearch}
                      onChange={e => setPeopleSearch(e.target.value)}
                      className="w-full px-3 py-1.5 text-sm bg-zinc-50 border border-zinc-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-300"
                      autoFocus
                    />
                  </div>
                  <div className="max-h-48 overflow-y-auto p-1">
                    {TEAM_MEMBERS.filter(m => m.toLowerCase().includes(peopleSearch.toLowerCase())).map(member => {
                      const active = filterPeople.includes(member);
                      return (
                        <button key={member}
                          onClick={() => setFilterPeople(prev => active ? prev.filter(p => p !== member) : [...prev, member])}
                          className={`w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm rounded-lg transition-colors
                            ${active ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50'}`}>
                          <div className={`w-4 h-4 rounded border flex items-center justify-center
                            ${active ? 'bg-zinc-900 border-zinc-900 text-white' : 'border-zinc-300'}`}>
                            {active && <Icon name="check" size={10} strokeWidth={3} />}
                          </div>
                          {member}
                        </button>
                      );
                    })}
                  </div>
                  {filterPeople.length > 0 && (
                    <div className="p-2 border-t border-zinc-100">
                      <button onClick={() => setFilterPeople([])}
                        className="w-full text-xs text-zinc-500 hover:text-zinc-700 py-1">
                        Clear all
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Service area filter */}
            <div className="relative" ref={serviceFilterRef}>
              <button
                onClick={() => setShowServiceFilterMenu(!showServiceFilterMenu)}
                className={`flex items-center gap-1.5 px-3 py-1.5 text-sm border rounded-lg transition-colors
                  ${filterServiceAreas.length > 0 ? 'bg-emerald-700 text-white border-emerald-700' : 'border-zinc-200 text-zinc-600 hover:bg-zinc-50'}`}
              >
                <Icon name="tag" size={14} />
                <span>Service{filterServiceAreas.length > 0 ? ` (${filterServiceAreas.length})` : ''}</span>
              </button>
              {showServiceFilterMenu && (
                <div className="absolute top-full left-0 mt-1 w-64 bg-white border border-zinc-200 rounded-xl shadow-lg z-20 overflow-hidden">
                  <div className="p-1">
                    {SERVICE_AREAS.map(area => {
                      const active = filterServiceAreas.includes(area);
                      return (
                        <button key={area}
                          onClick={() => setFilterServiceAreas(prev => active ? prev.filter(a => a !== area) : [...prev, area])}
                          className={`w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm rounded-lg transition-colors
                            ${active ? 'bg-emerald-50 text-emerald-800' : 'text-zinc-600 hover:bg-zinc-50'}`}>
                          <div className={`w-4 h-4 rounded border flex items-center justify-center
                            ${active ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-zinc-300'}`}>
                            {active && <Icon name="check" size={10} strokeWidth={3} />}
                          </div>
                          {area}
                        </button>
                      );
                    })}
                  </div>
                  {filterServiceAreas.length > 0 && (
                    <div className="p-2 border-t border-zinc-100">
                      <button onClick={() => setFilterServiceAreas([])}
                        className="w-full text-xs text-zinc-500 hover:text-zinc-700 py-1">
                        Clear all
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Sort */}
            <div className="relative" ref={sortRef}>
              <button
                onClick={() => setShowSortMenu(!showSortMenu)}
                className="flex items-center gap-1.5 px-3 py-1.5 text-sm border border-zinc-200 text-zinc-600 hover:bg-zinc-50 rounded-lg"
              >
                <Icon name="sortAsc" size={14} />
                <span className="capitalize">{sortBy}</span>
              </button>
              {showSortMenu && (
                <div className="absolute top-full right-0 mt-1 w-40 bg-white border border-zinc-200 rounded-xl shadow-lg z-20 p-1">
                  {['name', 'date', 'size'].map(s => (
                    <button key={s} onClick={() => {
                      if (sortBy === s) setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc');
                      else { setSortBy(s); setSortOrder('asc'); }
                      setShowSortMenu(false);
                    }}
                      className={`w-full text-left px-3 py-2 text-sm rounded-lg transition-colors flex items-center justify-between
                        ${sortBy === s ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50'}`}>
                      <span className="capitalize">{s}</span>
                      {sortBy === s && <span className="text-xs text-zinc-400">{sortOrder === 'asc' ? '↑' : '↓'}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="h-5 w-px bg-zinc-200 mx-1" />

            {/* Thumbnail size slider */}
            <div className="flex items-center gap-2">
              <Icon name="image" size={12} className="text-zinc-400" />
              <input
                type="range"
                min="100"
                max="400"
                value={thumbSize}
                onChange={e => setThumbSize(Number(e.target.value))}
                className="w-24"
              />
              <Icon name="image" size={18} className="text-zinc-400" />
            </div>

            <div className="h-5 w-px bg-zinc-200 mx-1" />

            {/* Select mode */}
            <button
              onClick={() => { setSelectMode(!selectMode); if (selectMode) setSelectedPhotos(new Set()); }}
              className={`flex items-center gap-1.5 px-3 py-1.5 text-sm border rounded-lg transition-colors
                ${selectMode ? 'bg-blue-500 text-white border-blue-500' : 'border-zinc-200 text-zinc-600 hover:bg-zinc-50'}`}
            >
              <Icon name="checkSquare" size={14} />
              <span>{selectMode ? 'Cancel' : 'Select'}</span>
            </button>

            {/* Batch actions */}
            {selectMode && selectedPhotos.size > 0 && (
              <>
                <button onClick={selectAll}
                  className="px-3 py-1.5 text-sm border border-zinc-200 text-zinc-600 hover:bg-zinc-50 rounded-lg">
                  Select all
                </button>
                <button
                  onClick={handleDownloadZip}
                  disabled={zipProgress !== null}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-sm bg-zinc-900 text-white rounded-lg hover:bg-zinc-800 disabled:opacity-50"
                >
                  <Icon name="download" size={14} />
                  {zipProgress
                    ? `Downloading ${zipProgress.current}/${zipProgress.total}...`
                    : `Download ${selectedPhotos.size} as ZIP`}
                </button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================
    function MainApp() {
      const { token, user, setToken, setUser, folderTree, setFolderTree, setExpandedFolders,
        currentFolderId, setPhotos, setAllPhotosFlat, setIsLoadingPhotos, setIsLoadingTree, isLoadingTree,
        setLoadingStatus, metadata, setMetadata, sidebarOpen, setSidebarOpen, folderNameMap,
        quickFilter, setCurrentFolderName, setError, error, thumbMap, setThumbMap } = useApp();

      // Thumbnail generation state
      const [thumbGenActive, setThumbGenActive] = useState(false);
      const [thumbGenProgress, setThumbGenProgress] = useState(null);

      const runThumbGen = useCallback(async () => {
        if (thumbGenActive || !token) return;
        setThumbGenActive(true);
        setThumbGenProgress({ current: 0, total: 0, created: 0, failed: 0, name: 'Scanning folders...' });
        try {
          // Always scan from root to get ALL images
          const allImages = await loadImagesRecursive(CONFIG.ROOT_FOLDER_ID, token, () => {});
          if (allImages.length === 0) {
            setThumbGenProgress({ current: 0, total: 0, created: 0, failed: 0, done: true });
            setThumbGenActive(false);
            return;
          }
          const result = await generateThumbnails(allImages, thumbMap, token, (p) => {
            setThumbGenProgress(p);
          });
          setThumbMap(result.map);
        } catch (err) {
          console.error('Thumbnail generation failed:', err);
        }
        setThumbGenActive(false);
      }, [thumbGenActive, token, thumbMap]);

      // Load folder tree on mount
      useEffect(() => {
        if (!token) return;
        let cancelled = false;

        async function init() {
          setIsLoadingTree(true);
          try {
            // Load metadata and thumbnail map in parallel
            const [meta, tMap] = await Promise.all([
              loadMetadata(token),
              loadThumbMap(token),
            ]);
            if (!cancelled) {
              setMetadata(meta);
              setThumbMap(tMap);
            }

            // Load root folder info
            const rootInfo = await driveApiFetch(`/files/${CONFIG.ROOT_FOLDER_ID}?fields=name`, token);
            const rootName = rootInfo.name || 'Photo Library';

            // Load first level of folders
            const subs = await loadSubfolders(CONFIG.ROOT_FOLDER_ID, token);
            const tree = {
              id: CONFIG.ROOT_FOLDER_ID,
              name: rootName,
              children: subs.map(f => ({ id: f.id, name: f.name, children: [], loaded: false })),
              loaded: true
            };
            tree.children.forEach(c => folderNameMap.current.set(c.id, c.name));
            folderNameMap.current.set(CONFIG.ROOT_FOLDER_ID, rootName);

            if (!cancelled) {
              setFolderTree(tree);
              setCurrentFolderName(rootName);
            }
          } catch (e) {
            if (!cancelled) setError(e.message);
          }
          if (!cancelled) setIsLoadingTree(false);
        }
        init();
        return () => { cancelled = true; };
      }, [token]);

      // Load photos — either by ID for quick filters, or via folder scan
      const folderPhotosCache = useRef({}); // cache folder scans: { folderId: [photos] }
      useEffect(() => {
        if (!token) return;
        let cancelled = false;

        // Quick filter active → fetch those specific photos by ID
        if (quickFilter) {
          let ids = [];
          if (quickFilter === 'adamSelects') ids = metadata.adamSelects || [];
          else if (quickFilter === 'favourites') ids = metadata.favourites || [];
          else if (quickFilter === 'myPicks' && user?.email) ids = metadata.personalPicks?.[user.email] || [];

          if (ids.length === 0) {
            setPhotos([]);
            setIsLoadingPhotos(false);
            setLoadingStatus('');
            return;
          }

          setIsLoadingPhotos(true);
          setLoadingStatus(`Loading ${ids.length} photos...`);

          fetchFilesByIds(ids, token).then(files => {
            if (!cancelled) {
              setPhotos(files);
              setLoadingStatus('');
              setIsLoadingPhotos(false);
            }
          }).catch(() => {
            if (!cancelled) setIsLoadingPhotos(false);
          });

          return () => { cancelled = true; };
        }

        // No quick filter → load from folder (recursive scan)
        if (!currentFolderId) return;

        // Use cache if available
        if (folderPhotosCache.current[currentFolderId]) {
          setPhotos(folderPhotosCache.current[currentFolderId]);
          return;
        }

        let foundCount = 0;
        setIsLoadingPhotos(true);
        setLoadingStatus('Scanning folders...');

        loadImagesRecursive(currentFolderId, token, (imgCount) => {
          foundCount += imgCount;
          if (!cancelled) setLoadingStatus(`Found ${foundCount} photos so far...`);
        }).then(images => {
          if (!cancelled) {
            folderPhotosCache.current[currentFolderId] = images;
            setPhotos(images);
            setLoadingStatus('');
            setIsLoadingPhotos(false);
          }
        }).catch(e => {
          if (!cancelled) {
            setError(e.message);
            setIsLoadingPhotos(false);
          }
        });

        return () => { cancelled = true; };
      }, [token, currentFolderId, quickFilter, metadata]);

      const handleSignOut = () => {
        const t = token;
        setToken(null);
        setUser(null);
        LS.set('user', null);
        try { google.accounts.oauth2.revoke(t); } catch {}
      };

      return (
        <div className="h-screen flex flex-col bg-white">
          {/* Header */}
          <header className="flex items-center justify-between px-4 py-2.5 border-b border-zinc-200 bg-white flex-shrink-0">
            <div className="flex items-center gap-3">
              <button onClick={() => setSidebarOpen(!sidebarOpen)}
                className="text-zinc-400 hover:text-zinc-600 p-1.5 rounded-lg hover:bg-zinc-100 transition-colors">
                <Icon name="sidebar" size={18} />
              </button>
              <div className="flex items-center gap-2">
                <span className="text-sm font-semibold tracking-tight">Today</span>
                <span className="text-zinc-300">|</span>
                <span className="text-sm text-zinc-500">Photo Library</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              {user && (
                <div className="flex items-center gap-2">
                  {user.picture ? (
                    <img src={user.picture} alt="" className="w-7 h-7 rounded-full" referrerPolicy="no-referrer"
                      onError={e => { e.target.style.display = 'none'; }} />
                  ) : (
                    <div className="w-7 h-7 rounded-full bg-zinc-200 flex items-center justify-center text-xs font-medium text-zinc-500">
                      {(user.name || '?')[0]}
                    </div>
                  )}
                  <span className="text-sm text-zinc-600 hidden sm:inline" title={user.email}>{user.name}</span>
                </div>
              )}
              <button onClick={handleSignOut}
                className="text-zinc-400 hover:text-zinc-600 p-1.5 rounded-lg hover:bg-zinc-100 transition-colors" title="Sign out">
                <Icon name="signOut" size={16} />
              </button>
            </div>
          </header>

          {/* Error banner */}
          {error && (
            <div className="bg-red-50 border-b border-red-100 px-4 py-2 flex items-center justify-between text-sm text-red-700">
              <span>{error}</span>
              <button onClick={() => setError(null)} className="text-red-400 hover:text-red-600">
                <Icon name="x" size={16} />
              </button>
            </div>
          )}

          {/* Main layout */}
          <div className="flex flex-1 min-h-0">
            {/* Sidebar */}
            <div className={`sidebar-transition border-r border-zinc-200 bg-zinc-50/50 flex-shrink-0 overflow-hidden
              ${sidebarOpen ? 'w-60 min-w-[240px]' : 'w-0 min-w-0'}`}>
              {sidebarOpen && (
                <div className="w-60 h-full flex flex-col">
                  <div className="flex-1 overflow-y-auto">
                    <FolderTree />
                  </div>
                  {/* Thumbnail generator (admin only) */}
                  {(user?.email?.toLowerCase().trim() === 'adam@today.design' || user?.email?.toLowerCase().trim() === 'kate@today.design') && <div className="border-t border-zinc-100 p-3">
                    {!thumbGenActive && !thumbGenProgress?.done && (
                      <button
                        onClick={runThumbGen}
                        disabled={!token}
                        className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-sm text-zinc-600 hover:bg-zinc-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        title="Generate small thumbnails for faster loading"
                      >
                        <Icon name="image" size={15} />
                        <span>Build thumbnails</span>
                        {Object.keys(thumbMap).length > 0 && (
                          <span className="ml-auto text-xs text-zinc-400">{Object.keys(thumbMap).length}</span>
                        )}
                      </button>
                    )}
                    {thumbGenActive && thumbGenProgress && (
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between text-xs text-zinc-500">
                          <span>Building thumbnails...</span>
                          <span>{thumbGenProgress.current}/{thumbGenProgress.total}</span>
                        </div>
                        <div className="w-full h-1.5 bg-zinc-200 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-zinc-800 rounded-full transition-all duration-300"
                            style={{ width: `${thumbGenProgress.total > 0 ? (thumbGenProgress.current / thumbGenProgress.total) * 100 : 0}%` }}
                          />
                        </div>
                        <div className="text-[10px] text-zinc-400 truncate">{thumbGenProgress.name}</div>
                      </div>
                    )}
                    {thumbGenProgress?.done && (
                      <div className="text-xs text-zinc-500 px-2 py-1">
                        Done — {thumbGenProgress.created} created{thumbGenProgress.failed > 0 ? `, ${thumbGenProgress.failed} failed` : ''}
                      </div>
                    )}
                  </div>}
                </div>
              )}
            </div>

            {/* Content */}
            <div className="flex-1 flex flex-col min-w-0">
              <Toolbar />
              <PhotoGrid />
            </div>
          </div>

          {/* Lightbox */}
          <Lightbox />

          {/* Tag Dialog */}
          <TagDialog />
        </div>
      );
    }

    // ============================================================
    // ROOT APP
    // ============================================================
    function App() {
      const { token } = useApp();
      return token ? <MainApp /> : <SignInScreen />;
    }

    // ============================================================
    // RENDER
    // ============================================================
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
